[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaulthalla-price-bot"
version = "0.1.0"
description = "Fetch, normalize, publish, and serve Vaulthalla object storage pricing profiles."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vaulthalla" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.27",
  "lxml>=5",
  "orjson>=3.10",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "sqlalchemy>=2.0",
  "tenacity>=8.5",
  "typer>=0.12",
  "uvicorn>=0.30",
  "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-httpx>=0.30",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
price-bot = "price_bot.cli:app"

[tool.setuptools.packages.find]
include = ["price_bot*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
